<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoraMeet</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #2d3436;
      --medium: #636e72;
      --accent: #55efc4;
      --accent2: #74b9ff;
      --text: #dfe6e9;
      --header-height: 60px;
      --controls-height: 80px;
      --sidebar-width: 200px;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      background: var(--medium);
      padding: 0 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .header h1 {
      color: var(--accent);
      font-size: 1.3rem;
    }

    .chat-btn {
      background: var(--accent);
      color: #2d3436;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .main-container {
      position: fixed;
      top: var(--header-height);
      left: 0;
      right: 0;
      bottom: var(--controls-height);
      display: flex;
      overflow: hidden;
    }

    .main-video-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      position: relative;
    }

    .video-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1rem;
      overflow: hidden;
    }

    .sidebar-right {
      width: var(--sidebar-width);
      background: var(--medium);
      display: flex;
      flex-direction: column;
      padding: 0.5rem;
      gap: 0.5rem;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .sidebar-right::-webkit-scrollbar {
      width: 6px;
    }

    .sidebar-right::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }

    .sidebar-right::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 3px;
    }

    .sidebar-video,
    .sidebar-no-video {
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 16/9;
      min-height: 100px;
      flex-shrink: 0;
    }

    .sidebar-video video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .sidebar-video .username,
    .sidebar-no-video .username {
      position: absolute;
      bottom: 4px;
      left: 4px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 0.75rem;
    }

    .sidebar-no-video {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px dashed #636e72;
    }

    .sidebar-no-video .avatar {
      font-size: 2rem;
      margin-bottom: 0.25rem;
    }

    .video-container {
      background: var(--medium);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      min-height: 0;
      width: 100%;
      height: 100%;
    }

    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .video-container .username {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-size: 0.9rem;
    }

    
    .fullscreen-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: none;
      border-radius: 8px;
      width: 32px;
      height: 32px;
      font-size: 16px;
      cursor: pointer;
      z-index: 15;
      opacity: 0;
      transition: opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-container:hover .fullscreen-btn,
    .screen-share-main:hover .fullscreen-btn,
    .sidebar-video:hover .fullscreen-btn {
      opacity: 1;
    }

    .fullscreen-btn:hover {
      background: rgba(0, 0, 0, 0.85);
    }

    /* Estilos cuando el contenedor está en fullscreen */
    .video-container:fullscreen,
    .sidebar-video:fullscreen {
      background: #000;
      border-radius: 0;
    }

    .video-container:fullscreen video,
    .sidebar-video:fullscreen video {
      object-fit: contain;
    }

    .video-container:fullscreen .fullscreen-btn,
    .sidebar-video:fullscreen .fullscreen-btn {
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      font-size: 20px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .self-view {
      position: fixed;
      bottom: calc(var(--controls-height) + 20px);
      right: calc(var(--sidebar-width) + 20px);
      width: 150px;
      height: 112px;
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid var(--accent);
      z-index: 50;
      background: var(--bg);
    }

    .self-view video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--controls-height);
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      background: var(--medium);
      z-index: 100;
    }

    .control-btn {
      padding: 0.8rem 1.5rem;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .control-btn.primary {
      background: var(--accent);
      color: #2d3436;
    }

    .control-btn.secondary {
      background: var(--accent2);
      color: #2d3436;
    }

    .control-btn.danger {
      background: #ff7675;
      color: #fff;
    }

    .control-btn:disabled {
      opacity: 0.5;
    }

    .control-btn.inactive {
      background: #636e72;
      color: #b2bec3;
    }

    .control-btn.hidden {
      display: none !important;
    }

    .chat-panel {
      position: fixed;
      right: 0;
      top: var(--header-height);
      bottom: var(--controls-height);
      width: 320px;
      background: var(--medium);
      box-shadow: -5px 0 25px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s;
      z-index: 200;
    }

    .chat-panel.open {
      transform: translateX(0);
    }

    .chat-header {
      padding: 1rem;
      background: var(--accent);
      color: #2d3436;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-close {
      background: none;
      border: none;
      color: #2d3436;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .message {
      padding: 0.8rem 1rem;
      border-radius: 15px;
      max-width: 85%;
      word-wrap: break-word;
    }

    .message.own {
      background: var(--accent);
      color: #2d3436;
      align-self: flex-end;
      margin-left: auto;
    }

    .message.other {
      background: var(--bg);
      align-self: flex-start;
    }

    .message.system {
      color: #b2bec3;
      align-self: center;
      font-size: 0.85rem;
      font-style: italic;
    }

    .chat-input-area {
      padding: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .chat-input {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .chat-input input {
      flex: 1;
      padding: 0.8rem;
      border-radius: 20px;
      border: none;
      background: var(--bg);
      color: var(--text);
    }

    .chat-input button {
      padding: 0.8rem 1.2rem;
      background: var(--accent);
      color: #2d3436;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .chat-actions {
      display: flex;
      gap: 0.5rem;
    }

    .chat-actions button {
      flex: 1;
      padding: 0.5rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 15px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    #fileInput,
    #imageInput {
      display: none;
    }

    .join-section {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .join-box {
      background: var(--medium);
      padding: 2rem;
      border-radius: 20px;
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    .join-box h2 {
      color: var(--accent);
      margin-bottom: 1.5rem;
    }

    .join-box input {
      width: 100%;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 12px;
      border: 2px solid #b2bec3;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }

    .device-select {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1rem;
      border-radius: 12px;
      border: 2px solid #b2bec3;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
    }

    .device-select option {
      background: var(--bg);
      color: var(--text);
    }

    .big-btn {
      background: var(--accent);
      color: #2d3436;
      padding: 1rem;
      border: none;
      border-radius: 12px;
      width: 100%;
      font-size: 1.1rem;
      cursor: pointer;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .big-btn:disabled {
      background: #636e72;
      cursor: not-allowed;
    }

    .secondary-btn {
      background: transparent;
      color: var(--accent);
      padding: 1rem;
      border: 2px solid var(--accent);
      border-radius: 12px;
      width: 100%;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
    }

    .hidden {
      display: none !important;
    }

    .presenter-indicator { display: none !important;
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 193, 7, 0.9);
      color: #000;
      padding: 0.5rem 1.5rem;
      border-radius: 20px;
      font-weight: bold;
      z-index: 90;
    }

    @media (max-width: 768px) {
      :root {
        --sidebar-width: 120px;
      }

      .sidebar-video {
        min-height: 70px;
      }

      
    .fullscreen-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: none;
      border-radius: 8px;
      width: 32px;
      height: 32px;
      font-size: 16px;
      cursor: pointer;
      z-index: 15;
      opacity: 0;
      transition: opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-container:hover .fullscreen-btn,
    .screen-share-main:hover .fullscreen-btn,
    .sidebar-video:hover .fullscreen-btn {
      opacity: 1;
    }

    .fullscreen-btn:hover {
      background: rgba(0, 0, 0, 0.85);
    }

    /* Estilos cuando el contenedor está en fullscreen */
    .video-container:fullscreen,
    .sidebar-video:fullscreen {
      background: #000;
      border-radius: 0;
    }

    .video-container:fullscreen video,
    .sidebar-video:fullscreen video {
      object-fit: contain;
    }

    .video-container:fullscreen .fullscreen-btn,
    .sidebar-video:fullscreen .fullscreen-btn {
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      font-size: 20px;
    }

    .self-view {
        right: calc(var(--sidebar-width) + 10px);
        width: 100px;
        height: 75px;
      }

      .chat-panel {
        width: 100%;
      }
    }

    /* === Presentation Mode Layout === */
    .main-container.presentation-active .sidebar-right {
      width: 280px;
      background: #2d3436;
      border-left: 2px solid rgba(85, 239, 196, 0.3);
    }

    .main-container.presentation-active .video-grid {
      grid-template-columns: 1fr;
    }

    .main-container.presentation-active .video-container video {
      object-fit: contain;
    }

    .main-container.presentation-active .sidebar-video {
      min-height: 120px;
      aspect-ratio: 16/9;
      border: 2px solid rgba(85, 239, 196, 0.2);
      border-radius: 10px;
      flex-shrink: 0;
    }

    .main-container.presentation-active .sidebar-video video {
      object-fit: cover;
    }

    .screen-share-main {
      grid-column: 1 / -1;
    }

    .screen-share-main video {
      object-fit: contain;
    }

    @media (max-width: 768px) {
      .main-container.presentation-active .sidebar-right {
        width: 140px;
      }

      .main-container.presentation-active .sidebar-video {
        min-height: 80px;
      }
    }
  </style>
</head>

<body>
  <!-- Join Section con selección de dispositivos -->
  <div class="join-section" id="joinSection">
    <div class="join-box">
      <h2>NoraMeet</h2>
      <div id="step1">
        <p>Selecciona tus dispositivos</p>
        <!-- NUEVO: Selectores de dispositivos -->
        <select id="cameraSelect" class="device-select">
          <option value="">Cargando camaras...</option>
        </select>
        <select id="micSelect" class="device-select">
          <option value="">Cargando microfonos...</option>
        </select>
        <select id="resolutionSelect" class="device-select">
          <option value="">Resolucion automatica</option>
          <option value="360">360p (bajo)</option>
          <option value="480">480p (medio)</option>
          <option value="720">720p (HD)</option>
          <option value="1080">1080p (Full HD)</option>
        </select>
        <button class="big-btn" id="startBtn" onclick="start(true)" disabled>Con Camara y Micro</button>
        <button class="secondary-btn" onclick="start(false)">Solo Chat</button>
      </div>
      <div id="step2" class="hidden">
        <input type="text" id="usernameInput" placeholder="Tu nombre" maxlength="20">
        <input type="text" id="roomInput" placeholder="Codigo de sala" maxlength="20">
        <button class="big-btn" onclick="createRoom()">Crear Sala</button>
        <button class="secondary-btn" onclick="joinRoom()">Unirse</button>
      </div>
    </div>
  </div>

  <div class="header">
    <h1>NoraMeet</h1>
    <div style="display:flex;align-items:center;gap:0.5rem">
      <span id="statusDot"
        style="width:12px;height:12px;border-radius:50%;background:#ff7675;display:inline-block"></span>
      <span id="transcriptionIndicator" title="Transcripción activa" style="display:none;font-size:14px;animation:blink 1.5s infinite;">🔴</span>
      <button class="chat-btn" onclick="toggleChat()">Chat</button>
    </div>
  </div>

  <div class="main-container">
    <div class="main-video-area" id="mainVideoArea">
      <div class="video-grid" id="videoGrid"></div>
    </div>
    <div class="sidebar-right" id="sidebarRight"></div>
  </div>

  <div class="controls">
    <button class="control-btn primary" onclick="toggleMic()" id="micBtn" disabled>🎤 Mic</button>
    <button class="control-btn primary" onclick="toggleCamera()" id="camBtn" disabled>📹 Cam</button>
    <button class="control-btn secondary hidden" onclick="toggleScreen()" id="screenBtn">Compartir</button>
    <!-- Transcripción auto-start al unirse --><button class="control-btn secondary" onclick="toggleTranscription()" id="transcribeBtn" title="Transcripción" style="display:none;">📝 Transcribir</button>
    <!-- NUEVO: Botón cambiar dispositivos -->
    <button class="control-btn secondary" onclick="openDeviceModal()" id="settingsBtn">&#9881; Config</button>
    <button class="control-btn danger" onclick="leaveRoom()">Salir</button>
  </div>

  <div class="chat-panel" id="chatPanel">
    <div class="chat-header">
      <span>Chat - <span id="roomDisplay"></span></span>
      <button class="chat-close" onclick="closeChat()">X</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <div class="chat-input">
        <input type="text" id="messageInput" placeholder="Escribe tu mensaje..."
          onkeypress="if(event.key==='Enter')sendMessage()">
        <button onclick="sendMessage()">Enviar</button>
      </div>
      <div class="chat-actions">
        <button onclick="document.getElementById('fileInput').click()">Archivo</button>
        <button onclick="document.getElementById('imageInput').click()">Imagen</button>
      </div>
      <input type="file" id="fileInput" onchange="handleFile(this.files[0]); this.value='';">
      <input type="file" id="imageInput" accept="image/*" onchange="handleImage(this.files[0]); this.value='';">
    </div>
  </div>

  <!-- NUEVO: Modal cambiar dispositivos durante llamada -->
  <div class="join-section hidden" id="deviceSettingsModal" style="z-index: 300; background: rgba(0,0,0,0.8);">
    <div class="join-box">
      <h2>Cambiar Dispositivos</h2>
      <select id="cameraSelectModal" class="device-select">
        <option value="">Cargando camaras...</option>
      </select>
      <select id="micSelectModal" class="device-select">
        <option value="">Cargando microfonos...</option>
      </select>
      <select id="resolutionSelectModal" class="device-select">
        <option value="">Resolucion automatica</option>
        <option value="360">360p (bajo)</option>
        <option value="480">480p (medio)</option>
        <option value="720">720p (HD)</option>
        <option value="1080">1080p (Full HD)</option>
      </select>
      <button class="big-btn" onclick="applyDeviceSettings()">Aplicar Cambios</button>
      <button class="secondary-btn" onclick="closeDeviceModal()">Cancelar</button>
    </div>
  </div>

  <div class="self-view hidden" id="selfView">
    <video id="localVideo" autoplay muted playsinline></video>
  </div>

  <script src="/static/app.js"></script>
</body>

</html>
